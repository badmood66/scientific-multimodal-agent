[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scimultimodal-agent"
version = "0.1.0"
description = "A knowledge-augmented multimodal agent for scientific chart reasoning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zimo Zhou" }]
dependencies = [
  "huggingface-hub>=0.30",
  "numpy>=1.26",
  "pandas>=2.2",
  "Pillow>=10.0",
  "pyarrow>=16.0",
  "PyYAML>=6.0",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
science-agent = "scimultimodal_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
