seed: 42
dataset:
  repo_id: ahmed-masry/ChartQA
  split: test
  max_samples: 100
  sample_strategy: balanced
model:
  model_id: Qwen/Qwen3-VL-2B-Instruct
  dtype: bfloat16
  max_new_tokens: 256
  max_pixels: 786432
  device: cuda
agent:
  mode: full
  enable_calculator: true
  enable_structured_memory: true
  enable_verifier: true
evaluation:
  relaxed_numeric_tolerance: 0.05
  save_traces: true

